tools:
- id: chat-tools
  title: כלים לשפה
  items:
  - name: ChatGPT
    company: OpenAI
    url: https://chatgpt.com/
    description: |
      ChatGPT הוא מודל עיבוד שפה טבעית של OpenAI, המסוגל להבין וליצור טקסטים דמויי אדם במגוון רחב של יישומים, כולל מענה על שאלות, כתיבת טקסטים ותרגום שפות.

      יכולות מרכזיות:
      - שיחה טבעית עם הבנת הקשר וניואנסים
      - יצירת תוכן כולל חיבורים, סיפורים, תסריטים וטקסטים שיווקיים
      - כתיבה ודיבוג קוד במגוון שפות תכנות
      - ניתוח וסיכום מידע בנושאים מורכבים
      - תרגום שפות ברמת דיוק סבירה במגוון רחב של שפות

      ChatGPT משמש סטודנטים, אנשי מקצוע, יוצרי תוכן, מפתחים וחברות המעוניינים לאוטומציה של משימות מבוססות טקסט, לשיפור היצירתיות או לגישה מהירה למידע. הוא מספק גישה למודלים המתאימים לעבודה יומיומית, לחשיבה ממושכת ולתהליכי עבודה ארוכים יותר; המודלים והיכולות הזמינים בפועל תלויים בתוכנית ובהפצה.
  - name: Claude
    company: Anthropic
    url: https://claude.ai/new
    description: |
      Claude הוא עוזר AI מתקדם שפותח על ידי Anthropic עם דגש על מועילות, בטיחות ויושרה. הוא מצטיין בשיחות מעמיקות, חשיבה מורכבת והבנת הוראות מדויקות במגוון רחב של נושאים ומשימות.

      חוזקות מרכזיות:
      - חלונות הקשר ארוכים לעבודה עם מסמכים ובסיסי קוד גדולים
      - חשיבה וניתוח מעמיקים של בעיות מורכבות
      - הבנה וסיכום מסמכים
      - כתיבה יצירתית עם תשומת לב לסגנון וטון
      - סיוע בקוד עם יכולות הסבר
      - נטייה מופחתת להמצאת מידע (הלוצינציות) בהשוואה למתחרים

      Claude שימושי במיוחד לחוקרים, כותבים, אנשי עסקים ומפתחים הצריכים לעבד מסמכים גדולים, ליצור תוכן מעמיק או לעסוק בפתרון בעיות מורכבות. גישת ה-Constitutional AI של Anthropic מכוונת ליצירת מערכות שהן גם עוצמתיות וגם מיושרות עם ערכים אנושיים ושיקולי בטיחות. זמינות המודלים ומגבלות ההקשר משתנות לפי המוצר והתוכנית.
  - name: Gemini
    company: Google
    url: https://gemini.google.com/
    description: |
      Gemini הוא מודל ה-AI המתקדם ביותר של Google, שתוכנן כמערכת מולטימודלית המסוגלת להבין ולנמק בין טקסט, תמונות, אודיו וקוד. הוא משלב את המומחיות של Google בחיפוש, במערכות ידע ובבינה מלאכותית כדי לספק יכולות רב-תכליתיות.

      תכונות מרכזיות:
      - הבנה מולטימודלית המאפשרת עבודה חלקה עם סוגי תוכן שונים
      - אינטגרציה עם החיפוש וגרף הידע של Google לבדיקת עובדות
      - יכולות חשיבה חזקות לפתרון בעיות מורכבות
      - יצירת, ניתוח והשלמת קוד במספר שפות תכנות
      - ניתוח מסמכים וחילוץ מידע
      - יכולות שיחה עם שמירת הקשר משופרת

      Gemini זמין בשכבות מודלים שונות, כולל Pro, Flash ו-Nano למכשירים, המותאמות למקרי שימוש שונים, מיישומים ארגוניים ועד פריסה במכשירים. הוא בעל ערך מיוחד למפתחים, חוקרים, יוצרי תוכן ואנשי מקצוע הצריכים לעבוד עם פורמטים שונים של תוכן ולנצל את מערכות הידע של Google.

  - name: STORM
    company: אוניברסיטת סטנפורד
    url: https://storm.genie.stanford.edu/
    description: |
      STORM הוא פרויקט מחקר של אוניברסיטת סטנפורד שמשתמש במודלי שפה גדולים כדי לכתוב מאמרים ארוכים בסגנון ויקיפדיה, המבוססים על מקורות מהרשת. במקום להתחיל מיד בכתיבה, הוא מתמקד בשלב שלפני הכתיבה: חקירת הנושא מכמה נקודות מבט ובניית ראשי פרקים לפני שהמאמר נכתב.

      יכולות מרכזיות:
      - איתור נקודות מבט שונות על הנושא לפני הכתיבה
      - הדמיית שיחות שבהן נקודות המבט האלה שואלות מומחה שנשען על אחזור מידע
      - ארגון המידע שנאסף לראשי פרקים, ומשם למאמר מלא עם הפניות למקורות
      - הדגמה פתוחה ברשת, וקוד המחקר זמין כקוד פתוח (stanford-oval/storm ב-GitHub)

      STORM שימושי לסטודנטים, לחוקרים, לכותבים ולאנליסטים שצריכים סקירה ראשונה עם מקורות על נושא לא מוכר, וגם למפתחים שחוקרים סוכני מחקר וכתיבה. התוצר הוא נקודת התחלה, ועדיין צריך לבדוק את העובדות שבו.

  - name: Fiscal.ai
    company: Fiscal.ai (לשעבר FinChat)
    url: https://fiscal.ai/
    description: |
      Fiscal.ai, שנקראה בעבר FinChat, היא פלטפורמת נתונים פיננסיים ומחקר השקעות מבוססת AI. החברה שינתה את שמה כדי לשקף מיקוד רחב יותר מממשק צ'אט: תשתית נתונים פיננסיים שמוגשת דרך מסוף מחקר ודרך ממשקי API.

      יכולות מרכזיות:
      - מסוף מחקר מקיף לנתוני מניות, דוחות ומדדים של חברות
      - שאלות וסיכומים בעזרת AI על גבי נתונים פיננסיים
      - ממשק API להזנת נתונים שמשמש פלטפורמות השקעה ומוסדות
      - מחברים שמכניסים את הנתונים הפיננסיים שלה לכלי AI אחרים

      Fiscal.ai משרתת משקיעים עצמאיים, אנשי מקצוע בפיננסים וצוותי פינטק שצריכים נתוני חברות מדויקים ורוצים עזרה של AI במחקר.

  - name: Google AI Studio
    company: Google
    url: https://aistudio.google.com/app/prompts/new_chat
    description: |
      Google AI Studio היא פלטפורמת פיתוח מקיפה המספקת גישה למודלים של Google AI לבניה, בדיקה ופריסה של יישומי AI. היא מציעה ממשק ידידותי למשתמש לתכנון פרומפטים, ניסויים במודלים ואינטראקטיה עם API.

      יכולות מרכזיות:
      - גישה למספר מודלי AI של Google כולל מודלי Gemini בעלי יכולות שונות
      - סביבת עיצוב ובדיקת פרומפטים אינטראקטיבית
      - אינטגרציה קלה עם API ליישומי הפקה
      - כלים להשוואת תגובות מודל בפרומפטים והגדרות שונות
      - יכולת לשמור ולארגן פרומפטים לשימוש עתידי
      - תכונות שיתוף פעולה לפיתוח AI מבוסס צוות

      Google AI Studio משרת מפתחים, מנהלי מוצר, חוקרים ועסקים המעוניינים לשלב יכולות AI ביישומים או בתהליכי העבודה שלהם. הוא מפשט את תהליך העבודה עם מודלי AI מתקדמים על ידי אספקת ממשקים חזותיים וגישה תכנותית, מה שהופך את פיתוח ה-AI לנגיש יותר למשתמשים בעלי רמות מומחיות טכנית שונות.

  - name: DeepSeek
    company: DeepSeek, Inc.
    url: https://platform.deepseek.com/api-docs/
    description: |
      DeepSeek מציעה API עוצמתי עבור בינה מלאכותית שיחתית ויצירת קוד, עם המודלים הפתוחים העדכניים שלה לשיחה ולחשיבה. היא מספקת יכולות חזקות לשילוב בינה מלאכותית ביישומים, תומכת גם בשיחות וגם בפונקציות קוד.
      

  - name: OpenRouter
    company: OpenRouter, LLC
    url: https://openrouter.ai/
    description: |
      OpenRouter מציעה ממשק מאוחד לניהול ואינטראקציה עם מודלים שונים של שפה גדולה (LLMs). היא עוזרת למשתמשים למצוא את המודלים והמחירים הטובים ביותר עבור הפקודות שלהם, ומגבירה את הפרודוקטיביות במשימות כמו שיחה, תמלול ותרגום.

  - name: Grok
    company: xAI
    url: https://grok.com/
    description: |
      Grok הוא העוזר השיחתי של xAI, המשולב באופן הדוק עם X (טוויטר) לידע בזמן אמת. המודלים שלו מציעים חשיבה חזקה, מודעות לרשת בזמן אמת, הבנת תמונות וסגנון שיחה ישיר וייחודי.

  - name: Kimi
    company: Moonshot AI
    url: https://www.kimi.com/
    description: |
      Kimi הוא העוזר של Moonshot AI, הבנוי על משפחת המודלים Kimi של החברה, שכוללת גם מודלים פתוחים. הוא ידוע בטיפול בהקשרים ארוכים במיוחד, בביצועי קוד סוכניים חזקים, ובמודלים הפתוחים הבולטים של Moonshot.

  - name: Perplexity
    company: Perplexity AI
    url: https://www.perplexity.ai/
    description: |
      Perplexity הוא מנוע תשובות מבוסס AI המשלב חיפוש רשת חי עם מודלי שפה, ומחזיר תשובות עם מקורות מצוטטים במקום רשימת קישורים. הוא נמצא בשימוש נרחב למחקר, לבדיקת עובדות ולהתעדכנות שוטפת, עם חיפוש Pro ודפדפן Comet שמרחיבים אותו לסביבת מחקר סוכנית.

- id: coding-tools
  title: סוכני קוד AI
  items:
  - name: Claude Code
    company: Anthropic
    url: https://claude.com/claude-code
    description: |
      Claude Code הוא כלי הקוד הסוכני של Anthropic: הוא עובד בטרמינל, בסביבות פיתוח וברשת, קורא את בסיס הקוד שלך, עורך קבצים, מריץ פקודות ובדיקות, ומסוגל להשלים משימות הנדסיות רב-שלביות באופן אוטונומי.

      יכולות מרכזיות:
      - הבנה עמוקה של בסיס הקוד ללא בחירת הקשר ידנית
      - הרצת פקודות מעטפת, בדיקות ותהליכי git מקצה לקצה
      - הרחבה באמצעות skills, סוכני משנה ושרתי MCP
  - name: Cursor
    company: Anysphere
    url: https://www.cursor.com/
    description: |
      Cursor הוא עורך קוד מונע AI המיועד לשפר את הפרודוקטיביות של המפתחים. הוא משתלב בצורה חלקה עם בסיס הקוד שלך, מנבא את העריכות הבאות שלך, ומאפשר לך לכתוב ולעדכן קוד באמצעות הוראות בשפה טבעית — כולל מצב סוכן רקע להאצלת משימות שלמות.
  - name: Devin Desktop (לשעבר Windsurf)
    company: Cognition
    url: https://devin.ai/desktop
    description: |
      Devin Desktop הוא השם החדש של Windsurf, סביבת הפיתוח הסוכנית של Cognition. הוא שומר על העורך, התוספים וההגדרות של Windsurf, ומוסיף מרכז בקרה לשליחה, למעקב ולתיאום של כמה סוכני קוד, מקומית או בענן של Devin, עם מעבר בין השניים.
  - name: GitHub Copilot
    company: GitHub
    url: https://github.com/features/copilot
    description: |
      GitHub Copilot הוא מתכנת ה-AI השותף של GitHub: השלמות בתוך הקוד, צ'אט, וסוכן קוד אוטונומי שיכול לקחת issue, לעבוד בסביבת ענן ולפתוח pull request. הוא תומך במגוון מודלי חזית ומשתלב בסביבות הפיתוח המרכזיות וב-github.com.
  - name: OpenAI Codex
    company: OpenAI
    url: https://openai.com/codex/
    description: |
      Codex הוא סוכן הנדסת התוכנה של OpenAI. הוא מריץ משימות במקביל בסביבות מבודדות בענן או מקומית דרך Codex CLI — כותב פיצ'רים, מתקן באגים, עונה על שאלות על בסיס הקוד ומציע pull requests לסקירה.
  - name: Gemini CLI
    company: Google
    url: https://github.com/google-gemini/gemini-cli
    description: |
      Gemini CLI הוא סוכן ה-AI של Google לטרמינל בקוד פתוח, מופעל על ידי Gemini. הוא מביא חלון הקשר גדול, עיגון ברשת מובנה ותמיכה ב-MCP לשורת הפקודה, עם שימוש חינמי נדיב למפתחים עצמאיים.
  - name: Continue
    company: Continue, Inc.
    url: https://www.continue.dev/
    description: |
      Continue הוא עוזר קוד קוד פתוח המגביר את הפרודוקטיביות של המפתחים על ידי מתן השלמה מותאמת אישית וחוויות צ'אט בתוך ה-IDE. הוא תומך בשילוב עם מודלים והקשרים שונים, ומאפשר למפתחים להישאר בזרימה בזמן הקידוד ומאיץ את הפיתוח עם מערכת Plug-and-Play.

- id: libraries
  title: ספריות/כלים קוד פתוח
  items:
  - name: TensorFlow
    company: Google
    url: https://www.tensorflow.org
    description: |
      TensorFlow היא פלטפורמת קוד פתוח מקיפה לבניית ופריסת מודלים של למידת מכונה, שפותחה ומתוחזקת על ידי Google. היא מספקת מערכת אקולוגית שלמה וגמישה של כלים, ספריות ומשאבי קהילה המאפשרים לחוקרים לקדם את חזית המחקר בלמידת מכונה, תוך מתן אפשרות למפתחים לבנות ולהפיץ בקלות יישומים מבוססי למידת מכונה.

      יכולות מרכזיות:
      - פלטפורמת למידת מכונה מקצה לקצה התומכת בתהליך המלא מהכנת נתונים ועד לפריסה
      - ממשק Keras ברמה גבוהה לתכנון מודלים מהיר לצד ממשקי API ברמה נמוכה יותר לשליטה מדויקת
      - אימון מבוזר על פני מספר GPU, TPU או מכונות
      - אפשרויות פריסה מוכנות לשימוש בפלטפורמות שונות (ענן, דפדפן, מובייל, מכשירי קצה)
      - כלי ויזואליזציה מקיפים באמצעות TensorBoard
      - מערכת אקולוגית נרחבת עם מודלים מאומנים מראש ומערכי נתונים

      TensorFlow נמצא בשימוש נרחב על ידי חוקרים, מדעני נתונים ומפתחים באקדמיה, חברות הזנק וארגונים גדולים בתעשיות כמו בריאות, פיננסים, רובוטיקה ועוד. הוא תומך במגוון רחב של יישומים, עם חוזקות מיוחדות ברשתות עצביות עמוקות לראייה ממוחשבת, עיבוד שפה טבעית וניתוח סדרות זמן.
    recentUpdates: |
      סביבת ההרצה של TensorFlow למכשירי קצה, שנקראה בעבר TensorFlow Lite, נקראת כעת LiteRT והיא חלק מ-Google AI Edge; TensorFlow.js ממשיכה לשמש ללמידת מכונה בדפדפן. יש לעיין בהערות המהדורה הרשמיות עבור השינויים בגרסת TensorFlow שבה משתמשים.

  - name: PyTorch
    company: Meta
    url: https://pytorch.org
    description: |
      PyTorch היא מסגרת למידת מכונה קוד פתוח גמישה ואינטואיטיבית המספקת מסלול חלק מאבטיפוס מחקרי לפריסה בייצור. פותחה על ידי Meta (לשעבר Facebook), והיא ידועה בגרף החישוב הדינמי שלה ובמודל התכנות הפייתוני המאפשר פיתוח טבעי ואקספרסיבי של מודלים ללמידה עמוקה.

      חוזקות מרכזיות:
      - גרף חישוב דינמי המאפשר ניפוי באגים קל יותר ופיתוח מודל אינטואיטיבי יותר
      - סגנון תכנות אימפרטיבי שמרגיש טבעי למפתחי פייתון
      - מערכת אקולוגית חזקה לראייה ממוחשבת (torchvision), עיבוד שפה טבעית (transformers) ותחומים אחרים
      - שימוש יעיל בזיכרון והאצת GPU
      - כלי הידור וייצוא (כמו torch.compile ו-torch.export) להעברת מודלים לסביבת ייצור
      - תמיכת קהילה חזקה ותיעוד נרחב

      PyTorch היא המסגרת המועדפת עבור חוקרים ואנשי מקצוע רבים במוסדות אקדמיים ומעבדות AI מובילות בזכות הגמישות וקלות השימוש שלה. היא מצטיינת בסביבות מחקר בהן איטרציה מהירה וניסויים הם קריטיים, תוך תמיכה גם בפריסה לייצור באמצעות ייצוא מודלים ואינטגרציה עם כלים כמו ONNX.
    recentUpdates: |
      סדרת PyTorch 2 הוסיפה את torch.compile להאצה מבוססת קומפיילר, לצד עבודה שוטפת על אימון מבוזר וכימות. TorchServe, שרת המודלים שהומלץ בעבר ל-PyTorch, נמצא כעת בתחזוקה מוגבלת ללא עדכונים או תיקוני אבטחה מתוכננים, ולכן בפריסות חדשות כדאי להשתמש בפתרון הגשה שמתוחזק באופן פעיל. יש לעיין בהערות המהדורה הרשמיות עבור הגרסה שבה משתמשים.

  - name: Scikit-learn
    company: פרויקט קוד פתוח
    url: https://scikit-learn.org
    description: |
      Scikit-learn היא ספריית למידת מכונה לפייתון. היא מציעה כלים פשוטים ויעילים לניתוח נתונים ולמידת מכונה,
      נגישים לכולם ומועילים בהקשרים שונים. היא בנויה על NumPy, SciPy ו-matplotlib, ומספקת מגוון רחב
      של אלגוריתמים לסיווג, רגרסיה, קיבוץ, הפחתת ממד, בחירת מודלים ועיבוד מקדים.
    recentUpdates: |
      Scikit-learn מתוחזקת באופן פעיל, עם מהדורות סדירות שמוסיפות יכולות, משפרות ביצועים ומתקנות תקלות. יש לעיין בהערות המהדורה הרשמיות עבור השינויים בגרסה שבה משתמשים.

  - name: Keras
    company: TensorFlow (Google)
    url: https://keras.io
    description: |
      Keras היא ממשק ברמה גבוהה לבניית ואימון מודלים של למידת מכונה עמוקה. היא מיועדת להיות מודולרית,
      מהירה וידידותית למשתמש. היא מאפשרת פרוטוטיפ מהיר ותומכת גם ברשתות קונבולוציה
      וגם ברשתות חוזרות, כמו גם בשילובים של השניים.
    recentUpdates: |
      Keras תומכת במנועי החישוב JAX, TensorFlow ו-PyTorch, ומאפשרת למפתחים לבנות ולאמן מודלים במסגרת המועדפת עליהם. הוראות להגדרת מנוע החישוב ודרישות התאימות מופיעות במדריכים הרשמיים.

  - name: Hugging Face Transformers
    company: Hugging Face
    url: https://huggingface.co/transformers/
    description: |
      Hugging Face Transformers היא ספרייה למודלים מתקדמים של שפה, המספקת גישה קלה למודלים מאומנים מראש.
      היא כוללת ארכיטקטורות מובילות לעיבוד שפה טבעית (NLP) כמו BERT, GPT-2, RoBERTa, XLM ועוד.
      הספרייה מאפשרת שימוש קל במודלים הללו למשימות כמו סיווג טקסט, זיהוי ישויות, מענה על שאלות ועוד.
    recentUpdates: |
      המערכת הרחבה של Hugging Face כוללת את Transformers.js להרצת מודלים ב-JavaScript ובדפדפן. יש לעיין בהערות המהדורה הרשמיות עבור השינויים בגרסה שבה משתמשים.

  - name: LangChain
    company: LangChain
    url: https://www.langchain.com/
    description: |
      LangChain היא מסגרת עוצמתית שתוכננה במיוחד לפיתוח יישומים המופעלים על ידי מודלים גדולים של שפה (LLMs). היא מספקת את אבני הבניין החיוניות ליצירת יישומים מודעי הקשר, מבוססי חשיבה המשלבים LLMs עם מקורות נתונים חיצוניים וכלים חישוביים.

      יכולות מרכזיות:
      - רכיבים מודולריים לשילוב LLMs עם מקורות נתונים שונים (מסמכים, מסדי נתונים, APIs)
      - תמיכה מובנית בארכיטקטורות Retrieval Augmented Generation (RAG)
      - כלי בניית שרשראות וסוכנים (agents) לחשיבה רב-שלבית מורכבת
      - מערכות זיכרון לשמירת הקשר שיחה
      - מסגרות הערכה למדידה ושיפור ביצועי היישום
      - אינטגרציה עם מסדי נתונים וקטוריים פופולריים ומודלי הטמעה
      - תיעוד נרחב ודוגמאות למקרי שימוש נפוצים

      LangChain משרת מפתחים, מדעני נתונים וארגונים המעוניינים לבנות יישומים מתוחכמים מבוססי LLM שחורגים מדפוסי תגובת-פרומפט פשוטים. הוא בעל ערך מיוחד לבניית צ'אטבוטים, מערכות מענה לשאלות, כלי ניתוח מסמכים ויישומים אחרים הדורשים שילוב של מודלי שפה עם ידע חיצוני או כלים.
    recentUpdates: |
      עדכונים אחרונים ב-LangChain כוללים ארכיטקטורות סוכן משופרות, צינורות עיבוד מסמכים משופרים, אינטגרציה טובה יותר עם מסדי נתונים וקטוריים פופולריים, והצגת LangGraph עבור תהליכי עבודה מורכבים יותר. המסגרת ממשיכה להתפתח במהירות לצד התקדמות ביכולות LLM.

  - name: LangGraph
    company: LangChain
    url: https://github.com/langchain-ai/langgraph
    description: |
      LangGraph היא ספריית פייתון המרחיבה את יכולות LangChain לבניית יישומים מורכבים מבוססי LLM.
      היא מאפשרת יצירת גרפים של זרימת מידע ושליטה, המורכבים מרכיבים שונים כמו LLMs, כלים ומקורות מידע חיצוניים.
      LangGraph מספקת מסגרת לתיאור ויישום תהליכים מורכבים, רב-שלביים כמו תכנון, פתרון בעיות וקבלת החלטות.
    recentUpdates: |
      LangGraph מפותחת על ידי צוות LangChain כמסגרת ברמה נמוכה יותר לסוכנים ארוכי טווח ובעלי מצב, עם שמירת מצב, עצירות לאישור אנושי והזרמת תוצאות.
      יש לעיין ביומן השינויים הרשמי עבור השינויים האחרונים.

  - name: LlamaIndex
    company: פרויקט קוד פתוח
    url: https://www.llamaindex.ai/
    description: |
      LlamaIndex היא ספרייה המתמחה באינדוקס יעיל ובחיפוש מידע עבור מודלים של שפה גדולה.
      LlamaIndex מספקת כלים לארגון ולניהול מידע מובנה ולא מובנה, ומאפשרת גישה יעילה למידע זה
      עבור LLMs. היא מציעה מגוון שיטות אינדוקס וחיפוש, ותומכת ביישום יעיל של טכניקות כמו RAG.
    recentUpdates: |
      LlamaIndex מפותחת באופן פעיל; יש לעיין ביומן השינויים הרשמי עבור השינויים האחרונים.

  - name: Gymnasium
    company: Farama Foundation
