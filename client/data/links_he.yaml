    description: |
      Gymnasium היא הגרסה המפוצלת והמתוחזקת של OpenAI Gym, המספקת ממשק Python אחיד לסביבות למידת חיזוק. OpenAI Gym אינה מקבלת עוד עדכונים, והצוות שתחזק אותה העביר את המשך הפיתוח ל-Gymnasium.

      יכולות מרכזיות:
      - API אחיד ליצירת סביבות, לאיפוס פרקי התנסות, לביצוע פעולות ולהצגה חזותית של תצפיות
      - סביבות לדוגמה לבקרה קלאסית, למשחקים ולשליטה ברובוטים בסימולציה
      - רכיבי עטיפה לשינוי תצפיות, תגמולים ופעולות
      - אותות נפרדים לסיום פרק התנסות ולקטיעתו
      - מדריך מעבר לפרויקטים קיימים המבוססים על Gym

      Gymnasium מיועדת לחוקרים, לסטודנטים ולמפתחים שבונים או מעריכים סוכני למידת חיזוק וזקוקים לממשק סביבות מתוחזק.

  - name: Pandas
