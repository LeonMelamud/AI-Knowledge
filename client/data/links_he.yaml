      יכולות מרכזיות:
      - פלטים מוגבלים ובעלי טיפוס מוגדר לסיווג, ניתוב, דירוג, חילוץ מידע והסתעפות
      - אומדני ביטחון המאפשרים לתהליכי עבודה לקבוע ספים או להעביר החלטות לא ודאיות לבדיקה
      - יצירת החלטות במקביל, המיועדת לאוטומציה בעלת השהיה נמוכה וליישומים בזמן אמת
      - שילוב מוכוון API לחיבור שלבי החלטה לתהליכי תוכנה רחבים יותר

      Jev מיועד למפתחים ולצוותים הבונים אוטומציה מבוססת AI, מנגנוני הגנה, צינורות עיבוד נתונים או יכולות מוצר בזמן אמת. הוא אינו מודל צ'אט ומוצע כיום בגישה מוקדמת.

