    url: https://bfl.ai/
    description: |
      FLUX היא משפחת המודלים של Black Forest Labs ליצירה ולעריכה של תמונות, הזמינה דרך ה-API של החברה ודרך פלטפורמות שותפות.
      כוונון מותאם אישית, למשל אימון LoRA על מספר קטן של תמונות משלכם, מאפשר ליצור דמויות, מוצרים או סגנונות באופן עקבי.
      FLUX משרתת קהל רחב, מחובבים ועד מעצבים מקצועיים ומפתחים שמשלבים יכולות תמונה במוצרים שלהם.

  - name: Astria
    company: Astria
    url: https://www.astria.ai/
    description: |
      Astria מציעה API לכוונון גנרטיבי, המאפשר יצירה מותאמת אישית ואישית של תמונות. היא מספקת כלים לצילומי AI, אפליקציות ניידות, מסננים, צילומי מוצרים ועוד, עם דגש על מודלים איכותיים של תמונות גנרטיביות.

  - name: Midjourney
    company: Midjourney, Inc.
    url: https://www.midjourney.com/
    description: |
      Midjourney הוא כלי מונע AI המייצר תמונות באיכות גבוהה מתוך פקודות טקסט. הוא בשימוש נרחב עבור פרויקטים יצירתיים, ומאפשר לאמנים ומעצבים לדמיין במהירות רעיונות ולחקור אפשרויות אמנותיות חדשות. עדכוני המודל השוטפים משפרים את איכות התמונה, ההיצמדות לפרומפט והשליטה היצירתית. אפשר לעבוד בה דרך אפליקציית הרשת או דרך קהילת ה-Discord שלה.


  - name: Tensor.Art
    company: Tensor.Art
    url: https://tensor.art/
    description: |
      Tensor.Art היא פלטפורמת יצירה המניעה משתמשים ליצור ולשתף אמנות דיגיטלית. היא מציעה כלים ליצירת סגנונות שונים, כולל אנימה, ריאליסטי וסיפורי מדע, ותומכת בזרימות עבודה לאירוח מודלים ואימון מקוון, מה שהופך אותה לכלי רב-תכליתי לאמנים ומעצבים.

  - name: Veo / Flow
    company: Google
    url: https://labs.google/flow/
    description: |
      Veo היא משפחת מודלי יצירת הווידאו של Google, שמסוגלת להפיק קטעים קולנועיים עם אודיו מסונכרן מובנה — דיאלוג, אפקטים קוליים ומוזיקה. Flow הוא כלי הקולנוע מבוסס ה-AI הבנוי סביבו, המאפשר ליוצרים לביים סצנות, להאריך שוטים ולשמור על דמויות עקביות בין קטעים.

  - name: ElevenLabs
    company: ElevenLabs
    url: https://elevenlabs.io/
    description: |
      ElevenLabs היא פלטפורמת הקול המובילה בתחום ה-AI: המרת טקסט לדיבור ריאליסטי בעשרות שפות, שכפול קול מיידי, דיבוב וסוכני קול שיחתיים. היא מפעילה קריינות, ספרי אודיו, משחקים ויישומי קול בזמן אמת.

- id: articles
  title: מאמרים
  items:
  - name: ארכיטקטורת מערכת LLM
    company: בלוג ארכיטקטורת תוכנה
    url: https://softwarearchiblog.co.il/2024/08/%d7%90%d7%a8%d7%9b%d7%99%d7%98%d7%a7%d7%98%d7%95%d7%a8%d7%aa-%d7%9e%d7%a2%d7%a8%d7%9b%d7%95%d7%aa-llm-%d7%90%d7%91%d7%a0%d7%99-%d7%94%d7%99%d7%a1%d7%95%d7%93.html
    description: |
      מאמר מעמיק על המרכיבים הבסיסיים של ארכיטקטורת מערכת LLM, דן במבנים נפוצים ובפרקטיקות הנדסיות לבניית מערכות המשתמשות רבות במודלים של שפה גדולה.

  - name: חקר AI קוד פתוח
    company: יוזמת קוד פתוח
    url: https://opensource.org/deepdive
    description: |
      חקר AI קוד פתוח הוא יוזמה של יוזמת הקוד הפתוח להגדיר ולקדם AI קוד פתוח. היא כוללת תהליך רב-גוני להקמת עקרונות המבטיחים שמערכות AI יהיו פתוחות, שקופות ושיתופיות, בדומה לתוכנה קוד פתוח מסורתית.

  - name: גנרטיב AI קומונס
    company: קרן LF AI & Data
    url: https://genaicommons.org/
    description: |
      גנרטיב AI קומונס מוקדש לקידום הדמוקרטיזציה, ההתקדמות והאימוץ של גנרטיב AI קוד פתוח יעיל, בטוח, אמין ואתי. הוא מספק פלטפורמת ממשלה ניטרלית לשיתוף פעולה, חינוך ופיתוח מודלים, מערכות נתונים ויישומים של AI קוד פתוח.

- id: educational-resources
  title: משאבים חינוכיים
  items:

  - name: סוכני GenAI
    company: NirDiamant
    url: https://github.com/NirDiamant/GenAI_Agents
    description: |
      מאגר זה מספק מדריכים ויישומים עבור טכניקות שונות של סוכני AI גנרטיביים, מיסודיים ועד מתקדמים. הוא משמש כמדריך מקיף לבניית מערכות AI אינטראקטיביות וחכמות.

  - name: הבנה ובניית יישומי LLM
    company: LinkedIn Pulse
    url: https://www.linkedin.com/pulse/understanding-building-llm-applications-pavan-belagatti-lakvc/
    description: |
      מאמר מאת פאוון בלאגטי העוסק בארכיטקטורה ובפיתוח יישומים המשתמשים במודלים של שפה גדולה (LLMs), כולל תובנות על רכיביהם, אימונם ויישומים מעשיים.

  - name: הנדסת פקודות עם W&B
    company: Weights & Biases
    url: https://colab.research.google.com/github/wandb/edu/blob/main/prompting/prompt_engineering.ipynb#scrollTo=ImDxqf2JbuZy
    description: |
      מדריך מקיף על הנדסת פקודות באמצעות Weights & Biases, המספק תובנות מעשיות ודוגמאות לאופטימיזציה של פקודות במודלים של AI.

  - name: סדנת Bedrock של אמזון
    company: דוגמאות AWS
    url: https://github.com/aws-samples/amazon-bedrock-workshop
    description: |
      סדנה זו מיועדת למפתחים ובוני פתרונות לנצל מודלים בסיסיים באמצעות Bedrock של אמזון. היא מספקת ניסיון מעשי עם יצירת טקסט ודימויים, התאמת מודלים ושילוב עם חבילות קוד פתוח כמו LangChain ו-FAISS.

  - name: קורס כוונון LLM
    company: Weights & Biases
    url: https://colab.research.google.com/github/wandb/edu/blob/main/llm-training-course/colab/finetuning.ipynb#scrollTo=d5754789-2e15-4bc9-800c-01f8ffc625e8
    description: |
      קורס מקיף על כוונון מודלים של שפה גדולה באמצעות Weights & Biases, המספק תובנות מעשיות ודוגמאות לאופטימיזציה של ביצועי מודלים.

  - name: Parlance Labs
    company: Parlance Labs
    url: https://parlance-labs.com/
    description: |
      Parlance Labs מתמקדת בפיתוח AI מעשי למערכות בסביבת ייצור. ההצעה המוכרת ביותר שלה היא קורס על בניית מערכות הערכה (evals) ליישומי AI, שאלפי מהנדסים ומנהלי מוצר כבר עברו, לצד חומרים לימודיים חינמיים על שימוש מעשי במודלי שפה.

  - name: נוף אינטראקטיבי של LF AI & Data Foundation
    company: LF AI & Data Foundation
    url: https://landscape.lfai.foundation/
    description: |
      הנוף האינטראקטיבי של LF AI & Data Foundation מספק סקירה מקיפה של פרויקטים של AI ונתונים קוד פתוח. הוא מודל אחרי הנוף של CNCF ומציע תובנות על מגוון כלים ופלטפורמות בלמידת מכונה, למידה עמוקה, עיבוד נתונים ועוד, ועוזר למשתמשים לנווט במערכת האקולוגית של AI קוד פתוח.

  - name: מסלולי הלמידה של NVIDIA DLI
    company: NVIDIA
    url: https://www.nvidia.com/en-us/learn/learning-paths/
    description: |
      המכון ללמידה עמוקה של NVIDIA (DLI) מציע הכשרות בבינה מלאכותית, במחשוב מואץ ובמדע נתונים, ומסלולי הלמידה שלו ממליצים על רצף קורסים לבניית כישורים והסמכות בתחום מסוים.

      מה מוצע:
      - קורסים מקוונים בקצב אישי, כולל קורסים חינמיים
      - סדנאות בהנחיית מדריך, גם כהדרכה פרטית לצוותים
      - תעודות בקורסים נבחרים
      - נושאים כמו למידה עמוקה, AI גנרטיבי ומודלי שפה גדולים, מדע נתונים, תשתיות AI, וגרפיקה וסימולציה

      המסלולים מתאימים למפתחים, למדעני נתונים ולצוותי IT שרוצים דרך מסודרת בתוכנית הלימודים של NVIDIA בתחום ה-AI.

- id: productivity
  title: כלים לשיפור פרודוקטיביות
  items:
  - name: NotebookLM
    company: Google
    url: https://notebooklm.google/
    description: |
      NotebookLM הוא כלי מונע AI של Google המיועד לשפר את הפרודוקטיביות על ידי שילוב יכולות למידת מכונה בהערות דיגיטליות. הוא עוזר למשתמשים לארגן, לחפש ולנתח את ההערות שלהם בצורה יעילה יותר, ומספק תובנות והמלצות על סמך התוכן.

  - name: Gamma
    company: Gamma
    url: https://gamma.app/
    description: |
      Gamma הוא כלי AI ליצירת מצגות, מסמכים ודפי רשת פשוטים מתוך פרומפט, ראשי פרקים או הערות קיימות. הוא מנסח את התוכן ואת העימוד, ואחר כך אפשר לערוך, לשנות עיצוב ולשתף.

  - name: Otter.ai
    company: Otter.ai
    url: https://otter.ai/
    description: |
      Otter.ai מספקת שירותי תמלול אוטומטיים, המאפשרים למשתמשים להמיר תוכן מדובר לטקסט כתוב בצורה יעילה, ומגבירה את הפרודוקטיביות בפגישות ובהרצאות.

  - name: Grammarly
    company: Superhuman (לשעבר Grammarly Inc.)
    url: https://www.grammarly.com/
    description: |
      Grammarly הוא עוזר כתיבה מונע AI המסייע למשתמשים לשפר את הכתיבה שלהם על ידי מתן הצעות לדקדוק, איות, סגנון וטון.

  - name: Jasper
    company: Jasper AI
    url: https://www.jasper.ai/
    description: |
      Jasper הוא כלי יצירת תוכן מונע AI המסייע בכתיבת פוסטים בבלוג, תוכן לרשתות חברתיות ועוד, ועוזר למשתמשים ליצור תוכן איכותי במהירות רבה יותר.

  - name: Replika
    company: Luka, Inc.
    url: https://replika.ai/
    description: |
      Replika היא חברה מונעת AI המיועדת לשוחח עם משתמשים, לספק תמיכה רגשית ולעזור ברווחה נפשית באמצעות שיחה.

  - name: Meetini
    company: Moonveil AI Inc.
    url: https://meetini.net/
    description: |
      Meetini הוא עוזר בתשלום לפגישות ולראיונות עבור מחשבי Mac עם Apple Silicon. כתוביות ותמלול בזמן אמת פועלים מקומית במחשב. השירות כולל סיכומי פגישות והיסטוריה, הכנה לראיונות וראיונות דמה. תוכנית Career מוסיפה מילות מפתח, הצעות לתשובות ושאלות המשך בעזרת AI בענן, עם 600 דקות AI בחודש.

      תוכנית Notes עולה 20 דולר לחודש או 45 דולר לרבעון; תוכנית Career עולה 95 דולר לחודש או 240 דולר לרבעון. המחירים העדכניים מופיעים בכתובת https://meetini.net/pricing. ההשקה הציבורית מתוכננת ל־9 בנובמבר 2026.
